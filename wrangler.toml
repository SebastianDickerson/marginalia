name = "marginalia"
main = "src/worker.js"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[observability]
enabled = true

# Optional vars — override per-env or via `wrangler secret put` for the *_KEY ones.
