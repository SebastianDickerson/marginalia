# fly.toml app configuration file generated for marginalia-lively-shape-699 on 2026-05-14T15:04:42+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'marginalia-lively-shape-699'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
